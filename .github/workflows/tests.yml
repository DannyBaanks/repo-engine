name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "ruff==0.17.5"
      - run: ruff check repo_engine tests
      - run: python -m pytest -q
  hooks-sandbox:
    # Commits y pushes reales contra un remoto local: hooks, compuerta y --no-verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/repo-engine-hooks.sh "$PWD"
  repo-engine:
    # La accion de este repo auditando a este repo (dogfooding): lo que agrega cada PR / push.
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
