# .github/workflows/repo-engine.yml — Repo Engine en cada PR y en cada push a la rama por defecto.
# El job se llama "repo-engine": ese es el check que exige el ruleset (templates/ci/ruleset.json).
name: repo-engine
on:
  pull_request:
  push:
    branches: [main]          # ajustar si la rama por defecto es master
permissions:
  contents: read
jobs:
  repo-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # BASE..HEAD necesita la historia
      - uses: DannyBaanks/repo-engine@REEMPLAZAR_POR_SHA   # fijar a un commit, no a una rama
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
